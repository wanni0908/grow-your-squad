<!DOCTYPE html>
<html>
<head>
  <title>Grow Your Squad</title>

  <style>
    #game{
      width:400px;
      height:600px;
      border:3px solid black;
    }
    #player{
      width:40px;
      height:40px;
      background:blue;
    }
    </style>
  
</head>
<body>
<h1>GROW YOUR SQUAD</h1>
<div id="game">
</div>
  <script>
const game = document.getElementById("game")
let player = document.createElement("div")
player.id = "player";
game.appendChild(player);
    let x = 0;
    let y = 0;
    let squad = 1;
    let squadText = document.createElement("div");
    squadText.innerText = "Squad: " + squad;
    game.appendChild(squadText);
    let friend = document.createElement("div");
    friend.innerText = "+1";
    friend.style.position = "absolute";
    friend.style.left = "180px";
    friend.style.top = "100px";
    game.appendChild(friend);
    friend.addEventListener("click", function(){
      squad += 1;
      squadText.innerText = "Squad : " + squad;
    });
document.addEventListener("keydown", function(event) {
    if (event.key === "ArrowRight") x += 10;
    if (event.key === "ArrowLeft") x -= 10;
    if (event.key === "ArrowDown") y += 10;
    if (event.key === "ArrowUp") y -= 10;

  player.style.transform =  `translate(${x}px, ${y}px `;
</script>
</body>
</html>
